name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: APK et release GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug et tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Nommer l'APK
        id: apk
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="app-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Version ${{ steps.apk.outputs.version }}
          body: |
            APK debug construit automatiquement par la CI.
            Installation : télécharger l'APK ci-dessous et l'ouvrir sur le téléphone.
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
